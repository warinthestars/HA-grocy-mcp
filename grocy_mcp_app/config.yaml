name: Grocy MCP Server
version: "0.5.1"
slug: grocy_mcp
description: Model Context Protocol server exposing your Grocy stock, shopping lists, recipes, chores and tasks to AI assistants.
url: https://github.com/warinthestars/HA-grocy-mcp
arch:
  - amd64
  - aarch64
image: ghcr.io/warinthestars/grocy-mcp-addon
init: false
startup: application
boot: auto
# FORK: web UI through Home Assistant ingress ("Open Web UI" and the sidebar panel).
# Ingress proxies to the same port; the UI only answers the Supervisor (172.30.32.2).
ingress: true
ingress_port: 8100
panel_icon: mdi:fridge-outline
panel_title: Grocy MCP
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: MCP streamable HTTP endpoint (/mcp)
options:
  grocy_url: "http://a0d7b954-grocy:80"
  grocy_api_key: ""
  mcp_auth_token: ""
  oauth_enabled: false
  log_level: info
schema:
  grocy_url: url
  grocy_api_key: password
  mcp_auth_token: password?
  oauth_enabled: bool
  public_url: url?
  oauth_client_id: str?
  oauth_client_secret: password?
  oauth_password: password?
  oauth_redirect_uris: str?
  log_level: list(debug|info|warning|error)
